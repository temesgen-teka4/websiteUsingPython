{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card card-custom p-4 bg-white">
            <h3 class="fw-bold mb-4 text-center text-dark">
                <i class="fa-solid fa-user-plus me-2" style="color: #4f46e5;"></i>Create an Account
            </h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input
                            type="email" 
                            class="form-control border-start-0 ps-0" 
                            id="email" 
                            name="email"
                            placeholder="Enter email"
                            required
                        />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="firstName" class="form-label fw-semibold">First Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input
                            type="text" 
                            class="form-control border-start-0 ps-0" 
                            id="firstName" 
                            name="firstName"
                            placeholder="Enter first name"
                            required
                        />
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password1" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input
                            type="password" 
                            class="form-control border-start-0 ps-0" 
                            id="password1" 
                            name="password1"
                            placeholder="At least 7 characters"
                            required
                        />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password2" class="form-label fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input
                            type="password" 
                            class="form-control border-start-0 ps-0" 
                            id="password2" 
                            name="password2"
                            placeholder="Confirm your password"
                            required
                        />
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="fa-solid fa-user-check me-1"></i> Register Account
                    </button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p class="text-muted small">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold" style="color: #4f46e5;">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
