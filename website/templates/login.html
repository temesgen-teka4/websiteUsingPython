{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-custom p-4 bg-white">
            <h3 class="fw-bold mb-4 text-center text-dark">
                <i class="fa-solid fa-right-to-bracket me-2" style="color: #4f46e5;"></i>Welcome Back
            </h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input
                            type="email" 
                            class="form-control border-start-0 ps-0" 
                            id="email" 
                            name="email"
                            placeholder="Enter your email"
                            required
                        />
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input
                            type="password" 
                            class="form-control border-start-0 ps-0" 
                            id="password" 
                            name="password"
                            placeholder="Enter your password"
                            required
                        />
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Login
                    </button>
                </div>
            </form>
            <div class="text-center mt-3">
                <p class="text-muted small">Don't have an account? <a href="{{ url_for('auth.sign_up') }}" class="text-decoration-none fw-semibold" style="color: #4f46e5;">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
